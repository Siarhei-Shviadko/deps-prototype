apiVersion: v1
kind: Service
metadata:
  name: prototype
  labels:
    {{- include "deps-prototype.labels" . | nindent 4 }}
spec:
  type: {{ .Values.prototype.service.type }}
  ports:
    - port: {{ .Values.prototype.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-prototype.selectorLabels" . | nindent 4 }}
