databaseChangeLog:
- changeSet:
    id: 1
    author: Palina Pashkouskaya
    changes:
    - createTable:
        tableName: field
        columns:
        - column:
            name: id
            type: VARCHAR(100)
            constraints:
              primaryKey: true
        - column:
            name: prototype_id
            type: VARCHAR(100)
            constraints:
              nullable: false
              foreignKeyName: prototype_id_fkey
              references: prototype(id)
              deleteCascade: true
        - column:
            name: name
            type: VARCHAR(150)
            constraints:
              nullable: false
        - column:
            name: field_type_code
            type: VARCHAR(100)
            constraints:
              nullable: false
        - column:
            name: field_type_description
            type: JSONB
            constraints:
              nullable: false
        - column:
            name: mapping_type
            type: VARCHAR(100)
            constraints:
              nullable: false
        - column:
            name: mapping_keys
            type: JSONB
            constraints:
              nullable: false
        - column:
            name: required
            type: BOOLEAN
            constraints:
              nullable: false
        - column:
            name: created_at
            type: TIMESTAMP WITH TIMEZONE
            defaultValueComputed: current_timestamp
            constraints:
              nullable: false

    rollback:
      - dropTable:
          - tableName: field
