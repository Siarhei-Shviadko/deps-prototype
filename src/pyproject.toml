[tool.poetry]
name = "prototype"
version = "0.1.0"
description = "Prototype is a service that extracts information by mapping the data received during document parsing into fields specific to the document type"
authors = []

[tool.poetry.dependencies]
python = "^3.11"
dependency-injector = "^4.48.0"
pydantic = "^2.12.0"
pydantic-settings = "^2.11.0"
python-dateutil = "^2.8.1"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.120"
SQLAlchemy = "1.3.12"
authlib = "^1.6.4"
python-multipart = "^0.0.22"
types-python-dateutil = "^2.8.0"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-extracted-data = { path = "../vendors/deps-extracted-data", develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }

[tool.poetry.group.dev.dependencies]
setuptools = ">=70,<82"
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = ">=3.7,<5"
wemake-python-styleguide = "^0.17.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
requests-mock = "~1.9.3"
types-requests = "^2.25.6"
wdb = "^3.3.0"
h11 = "^0.16.0"
httpx = "^0.27.0"

ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
datasource = ["datasource"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py311']
exclude = '''
(
    .venv
    | vendors
)
'''

[tool.pytest.ini_options]
markers = [
    "prototype",
    "mappings",
    "extraction",
    "prototype_creation_saga",
    "layouts",
    "reference_layout",
    "reference_layout_restart",
    "point",
    "no_doc_type_processing",
    "tabular_mappings",
]
